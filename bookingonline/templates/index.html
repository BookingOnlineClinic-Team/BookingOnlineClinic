<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang chủ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
  <h2>Trang chủ hệ thống đặt lịch khám</h2>
  {% if current_user.is_authenticated %}
  <p>Xin chào, {{ current_user.name }}!</p>
  <a href="{{ url_for('health_profiles') }}" class="btn btn-info">Hồ sơ khám</a>
  <!-- TODO: bật lại khi route create_appointment (chức năng đặt lịch) được cài đặt -->
  <a href="{{ url_for('logout') }}" class="btn btn-secondary">Đăng xuất</a>
{% else %}
  <a href="{{ url_for('login') }}" class="btn btn-primary">Đăng nhập</a>
{% endif %}
</body>
</html>
