<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Sửa hồ sơ khám</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
  <a href="{{ url_for('health_profiles') }}" class="btn btn-link px-0">&laquo; Danh sách hồ sơ khám</a>
  <h2 class="mb-4">Sửa hồ sơ khám</h2>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-warning">
        {% for msg in messages %}<p class="mb-0">{{ msg }}</p>{% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <!-- HTML form thuần không hỗ trợ method PATCH -> submit qua fetch() bên
       dưới, gọi thật PATCH /health-profiles/<id> -->
  <form id="editForm">
    <div class="mb-3">
      <label for="name" class="form-label">Họ tên *</label>
      <input type="text" class="form-control" id="name" name="name" value="{{ profile.name }}" required>
    </div>
    <div class="mb-3">
      <label for="phone" class="form-label">Số điện thoại *</label>
      <input type="text" class="form-control" id="phone" name="phone" value="{{ profile.phone }}" required>
    </div>
    <div class="mb-3">
      <label for="gender" class="form-label">Giới tính</label>
      {% set g = profile.gender.value if profile.gender else '' %}
      <select class="form-select" id="gender" name="gender">
        <option value="" {% if g == '' %}selected{% endif %}>-- Không chọn --</option>
        <option value="MALE" {% if g == 'MALE' %}selected{% endif %}>Nam</option>
        <option value="FEMALE" {% if g == 'FEMALE' %}selected{% endif %}>Nữ</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="dateOfBirth" class="form-label">Ngày sinh</label>
      <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" value="{{ profile.dateOfBirth or '' }}">
    </div>
    <div class="mb-3">
      <label for="address" class="form-label">Địa chỉ</label>
      <input type="text" class="form-control" id="address" name="address" value="{{ profile.address or '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
  </form>

  <script>
    document.getElementById('editForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var body = new URLSearchParams(new FormData(e.target));
      fetch("{{ url_for('health_profile_detail', profile_id=profile.id) }}", {
        method: 'PATCH',
        body: body
      })
        .then(function (res) { return res.json(); })
        .then(function (data) { window.location.href = data.redirect; })
        .catch(function () { alert('Có lỗi xảy ra, vui lòng thử lại.'); });
    });
  </script>
</body>
</html>
