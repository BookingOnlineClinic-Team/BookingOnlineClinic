{% if current_user.is_authenticated %}
<button type="button" id="chatbot-fab" class="chatbot-fab" title="Trợ lý AI gợi ý bác sĩ" aria-label="Mở Chatbot AI">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
</button>

<div id="chatbot-panel" class="chatbot-panel" hidden>
  <div class="chatbot-header">
    <div class="chatbot-header-info">
      <div class="chatbot-avatar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </div>
      <div>
        <div class="chatbot-title">Trợ Lý AI - Gợi Ý Bác Sĩ</div>
        <div class="chatbot-subtitle">Phòng Khám Đa Khoa OU</div>
      </div>
    </div>
    <button type="button" id="chatbot-close-btn" class="chatbot-close-btn" aria-label="Đóng Chatbot">&times;</button>
  </div>

  <div id="chatbot-messages" class="chatbot-messages"></div>

  <div id="chatbot-input-area" class="chatbot-input-area">
    <input type="text" id="chatbot-text-input" class="chatbot-text-input"
           placeholder="Mô tả triệu chứng của bạn..." maxlength="500" autocomplete="off">
    <button type="button" id="chatbot-send-btn" class="chatbot-send-btn" aria-label="Gửi">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>
{% endif %}
